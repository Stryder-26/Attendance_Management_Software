{% extends 'base.html' %}{% block content %}<h3>Create Class in {{ department.name }}</h3><form method="post"><div class="mb-3"><input class="form-control" name="name" placeholder="Class name" required></div><div class="mb-3"><label class="form-label">Assign Teacher</label><select name="teacher_id" class="form-select"><option value="">-- Unassigned --</option>{% for teacher in teachers %}<option value="{{ teacher.id }}">{{ teacher.name }}</option>{% endfor %}</select></div><button type="submit" class="btn btn-success">Create</button></form>{% endblock %}
