{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h3>Mandatory Credential Change</h3><p class="text-muted">For security, you must change the default administrator login ID and password before you can proceed.</p><form method="post"><div class="mb-3"><label class="form-label">New Email (Login ID)</label><input type="email" name="new_email" class="form-control" required></div><div class="mb-3"><label class="form-label">New Password</label><input type="password" name="new_password" class="form-control" required></div><div class="mb-3"><label class="form-label">Confirm New Password</label><input type="password" name="confirm_password" class="form-control" required></div><button type="submit" class="btn btn-primary">Set New Credentials</button></form></div></div></div></div>{% endblock %}
