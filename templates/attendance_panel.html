{% extends 'base.html' %}{% block content %}<h3>Attendance — {{ cl.name }} — {{ date }}</h3><form method="post"><table class="table"><thead><tr><th>Name</th><th>Present</th></tr></thead><tbody>{% for student, checked in students_with_status %}<tr><td>{{ student.name }}</td><td><input type="checkbox" name="present_{{ student.id }}" value="1" class="form-check-input" {% if checked %}checked{% endif %}></td></tr>{% endfor %}</tbody></table><button class="btn btn-success">Save Attendance</button></form>{% endblock %}
