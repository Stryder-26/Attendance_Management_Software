{% extends 'base.html' %}{% block content %}<h3>Register New Teacher in {{ current_user.college.name }}</h3><form method="post"><div class="mb-3"><label class="form-label">Teacher's Name</label><input class="form-control" name="name" required></div><div class="mb-3"><label class="form-label">Teacher's Email</label><input type="email" class="form-control" name="email" required></div><div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div><div class="mb-3"><label class="form-label">Assign to Department</label><select name="department_id" class="form-select" required><option value="">-- Select Department --</option>{% for dept in departments %}<option value="{{ dept.id }}">{{ dept.name }}</option>{% endfor %}</select></div><button type="submit" class="btn btn-success">Register Teacher</button></form>{% endblock %}
