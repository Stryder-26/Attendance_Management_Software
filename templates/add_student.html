{% extends 'base.html' %}{% block content %}<h3>Add Students to {{ cl.name }}</h3><form method="post"><div class="mb-3"><input class="form-control" name="name" placeholder="Student full name"></div><div class="mb-3"><input class="form-control" name="enroll" placeholder="Enrollment no (optional)"></div><button type="submit" name="submit_manual" class="btn btn-success">Add Manually</button></form><hr><h5>Or Upload a File</h5><p>Upload a CSV or Excel file with columns: <code>name, enrollment_no</code></p><form method="post" enctype="multipart/form-data"><input type="file" name="file" class="form-control"><button type="submit" name="submit_file" class="btn btn-primary mt-2">Upload File</button></form>{% endblock %}
