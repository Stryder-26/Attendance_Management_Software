{% extends 'base.html' %}{% block content %}<h3>Department: {{ department.name }}</h3><a class="btn btn-primary mb-2" href="{{ url_for('create_class', department_id=department.id) }}">Add Class</a><ul class="list-group">{% for cl in department.classes %}<li class="list-group-item d-flex justify-content-between align-items-center">{{ cl.name }} <small class="text-muted">— Teacher: {{ cl.teacher.name if cl.teacher else 'N/A' }}</small><div><a class="btn btn-sm btn-outline-secondary" href="{{ url_for('manage_class', class_id=cl.id) }}">Open</a></div></li>{% else %}<li class="list-group-item">No classes yet.</li>{% endfor %}</ul>{% endblock %}
