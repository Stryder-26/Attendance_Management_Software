{% extends 'base.html' %}{% block content %}<h3>Register New College Admin</h3><form method="post"><div class="mb-3"><label class="form-label">Admin's Name</label><input class="form-control" name="name" required></div><div class="mb-3"><label class="form-label">Admin's Email</label><input type="email" class="form-control" name="email" required></div><div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div><div class="mb-3"><label class="form-label">Assign to College</label><select name="college_id" class="form-select" required><option value="">-- Select College --</option>{% for college in colleges %}<option value="{{ college.id }}">{{ college.name }}</option>{% endfor %}</select></div><button type="submit" class="btn btn-success">Register Admin</button></form>{% endblock %}
